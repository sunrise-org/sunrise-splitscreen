name: Splitscreen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: Exact SDK release tag (sdk- followed by the full game commit); blank uses the manifest pin
        type: string
        required: false
      force_hosted:
        description: Verify the build on a GitHub-hosted runner even if the pool lease is active
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pool.outputs.runner }}
    steps:
      - id: pool
        env:
          FORCE_HOSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_hosted }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          POOL: ${{ vars.SPLITSCREEN_CI_RUNNER }}
          SERVED: >-
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          runner=ubuntu-latest
          if [[ "$FORCE_HOSTED" != true && "$SERVED" == true && -n "$POOL" && "$LEASE" =~ ^[0-9]{1,12}$ ]] &&
             [ "$LEASE" -gt "$(date +%s)" ]; then
            runner=$POOL
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build:
    needs: route
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the game's link libraries on a GitHub-hosted runner
        if: needs.route.outputs.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libasound2-dev libudev-dev
      - name: Check and package against the signed Sunrise SDK
        id: sdk
        env:
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: bash tools/build-sdk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: splitscreen-${{ steps.sdk.outputs.sdk_tag }}-unsigned
          path: target/${{ steps.sdk.outputs.sdk_tag }}/
          if-no-files-found: error
          retention-days: 7
