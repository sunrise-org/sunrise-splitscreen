
# Development fixture only, on the signed pin before built-in splitscreen is removed.
[[native.module]]
id = "guest-fixture-app"
file = "crates/sunrise-client/src/game/runtime/loading_screen.rs"
name = "splitscreen_app"
source = "src/guest/app.rs"

[[native.module]]
id = "guest-fixture-view"
file = "crates/sunrise-client/src/game/runtime/loading_screen.rs"
name = "splitscreen_view"
source = "src/guest/view.rs"

[[native.mixin]]
id = "guest-fixture-direct"
target = "sunrise_client::game::loading_screen::run_event_loop"
kind = "OVERWRITE"
helper = "src/guest/direct.rs"
bindings = [{ name = "game", ty = "Game<'_>", value = "game" }]

[[native.mixin]]
id = "guest-fixture-loading"
target = "sunrise_client::game::resource_loader::run_loading"
kind = "OVERWRITE"
helper = "src/guest/loading.rs"
bindings = [
  { name = "options", ty = "Options", value = "options" },
  { name = "settings", ty = "Settings", value = "settings" },
  { name = "vanilla_root", ty = "PathBuf", value = "vanilla_root" },
  { name = "pack_error", ty = "Option<String>", value = "pack_error" },
  { name = "started", ty = "Instant", value = "started" },
]

[[native.mixin]]
id = "guest-fixture-presence"
target = "sunrise_client::game::client_tick_steps::Game::client_tick_steps"
kind = "WRAP_OPERATION"
selector = "sunrise_client::social::set_presence_status"
require = 1
ordinal = 0
helper = "src/guest/presence.rs"
bindings = [
  { name = "status", ty = "sunrise_client::social::PresenceStatus", value = "$arg0" },
  { name = "set", ty = "impl FnOnce(sunrise_client::social::PresenceStatus) -> ()", value = "$operation" },
]

[[native.mixin]]
id = "guest-fixture-social"
target = "sunrise_client::game::client_tick_steps::Game::client_tick_steps"
kind = "WRAP_OPERATION"
selector = "sunrise_client::social::tick"
require = 1
ordinal = 0
helper = "src/guest/social.rs"
bindings = [{ name = "tick", ty = "impl FnOnce() -> ()", value = "$operation" }]

[[native.mixin]]
id = "guest-fixture-no-skin-downloads"
target = "sunrise_client::game::remote::Game::update_remote_skins"
kind = "HEAD"
cancellable = true
helper = "src/guest/local_only.rs"

[[native.mixin]]
id = "guest-fixture-no-profile-lookups"
target = "sunrise_client::game::remote::Game::resolve_inline_profiles"
kind = "HEAD"
cancellable = true
helper = "src/guest/local_only.rs"

[[native.mixin]]
id = "guest-fixture-no-item-profile-lookups"
target = "sunrise_client::game::item_draw::<Host as SpecialHost>::player_skin"
kind = "HEAD"
cancellable = true
helper = "src/guest/no_skin.rs"

[[native.mixin]]
