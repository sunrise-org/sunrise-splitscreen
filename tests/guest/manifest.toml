target = "sunrise_client::game::remote::Game::connect_remote_session"
kind = "HEAD"
cancellable = true
helper = "src/guest/join.rs"
bindings = [
  { name = "local", ty = "&Option<sunrise_protocol::connection::Pipe>", value = "&local" },
  { name = "lan", ty = "bool", value = "lan" },
  { name = "realm", ty = "bool", value = "realm" },
]

